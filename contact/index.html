<body>
  <h1>Contact</h1>
  <p>Get in touch with me.</p>
  <form action="mailto:nashktorab@ucsd.edu" method="POST" enctype="text/plain">
  <p>
    <label>
      Your email:
      <input type="email" name="email">
    </label>
  </p>

  <p>
    <label>
      Subject:
      <input name="subject">
    </label>
  </p>

  <p>
    <label>
      Message:
      <textarea name="body" rows="5"></textarea>
    </label>
  </p>

  <button type="submit">Send</button>
</form>
</body>
