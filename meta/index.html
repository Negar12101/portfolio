<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="module" src="../global.js"></script>

<body>
  <h1>Meta</h1>
  <p>
    An analysis of the code and commit history of my portfolio website.
  </p>
  <section>
  <h2>Code Summary</h2>
  <div id="stats"></div>
</section>
<section>
