<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Temperature Change Explorer</title>

  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script type="module" src="./main.js"></script>
</head>

<body>
  <main>
    <header>
      <p>DSC 209 · Project 3</p>
      <h1>Temperature Change Explorer</h1>
      <p>
        How do annual temperature changes differ across
        countries over time?
      </p>
    </header>

    <p id="status" role="status">Loading data…</p>

    <section aria-label="Visualization">
      <div id="chart"></div>
    </section>

    <footer>
      <p>
        Source: IMF Climate Change Indicators, using FAOSTAT data.
        Temperature changes are measured in °C relative to
        the 1951–1980 baseline.
      </p>
    </footer>
  </main>
</body>
</html>
